<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1v1 Arena (웹 버전)</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stage">
        <canvas id="game" width="1280" height="720"></canvas>

        <!-- 시작 화면의 온라인 메뉴 -->
        <div id="lobby" hidden>
            <!-- 방 목록 (멀티존 방식): 방을 눌러 들어가기 -->
            <div class="menu">
                <div class="title">온라인 대전 <small>방을 눌러 들어가세요 (↑↓ + ENTER도 돼요)</small></div>
                <div id="room-list" class="room-list"></div>
                <div class="row">
                    <button id="btn-create" type="button">방 만들기</button>
                    <span class="or">또는</span>
                    <input id="room-code" type="text" placeholder="방 코드" maxlength="4" autocomplete="off" spellcheck="false">
                    <button id="btn-join" type="button" class="sub">코드로 들어가기</button>
                </div>
                <div class="keys">온라인 조작: 이동 방향키 · 평타 Q · 스킬 W, E · 궁극기 R · 준비 SPACE</div>
                <div class="server"></div>
            </div>
            <!-- 방 만들기 -->
            <div class="form create-form" hidden>
                <div class="title">방 만들기</div>
                <input id="room-name" type="text" placeholder="방 이름 (최대 16자)" maxlength="16" autocomplete="off" spellcheck="false">
                <input id="room-pw" type="password" placeholder="비밀번호 (없으면 비워 두기 · 최대 12자)" maxlength="12" autocomplete="new-password">
                <div class="hint">비밀번호는 친구끼리만 들어오게 하는 용도예요. 진짜 계정 비밀번호는 쓰지 마세요.</div>
                <div class="row">
                    <button id="btn-create-ok" type="button">만들기</button>
                    <button id="btn-create-cancel" type="button" class="sub">취소</button>
                </div>
            </div>
            <!-- 비밀번호 있는 방에 들어가기 -->
            <div class="form pw-form" hidden>
                <div class="title">🔒 <span class="pw-room"></span></div>
                <input id="join-pw" type="password" placeholder="비밀번호" maxlength="12" autocomplete="off">
                <div class="row">
                    <button id="btn-pw-ok" type="button">들어가기</button>
                    <button id="btn-pw-cancel" type="button" class="sub">취소</button>
                </div>
            </div>
            <div class="busy" hidden>
                <div class="busy-text"></div>
                <button id="btn-cancel" type="button">취소</button>
            </div>
            <div class="notice"></div>
        </div>

        <!-- 온라인 대전 중 상태 표시줄 -->
        <div id="online-bar" hidden>
            <span class="bar-text"></span>
            <button id="btn-leave" type="button">나가기</button>
        </div>
    </div>

    <!-- 순서가 중요하다: 아래 파일이 위 파일의 기능을 가져다 쓴다 -->
    <script src="js/hit_sound_data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/vfx.js"></script>
    <script src="js/status.js"></script>
    <script src="js/status_vfx.js"></script>
    <script src="js/world.js"></script>
    <script src="js/player.js"></script>
    <script src="js/characters/common.js"></script>
    <script src="js/terrain.js"></script>
    <script src="js/characters/swordman.js"></script>
    <script src="js/characters/mage.js"></script>
    <script src="js/characters/fighter.js"></script>
    <script src="js/characters/accelerator.js"></script>
    <script src="js/characters/demolitionist.js"></script>
    <script src="js/characters/hacker.js"></script>
    <script src="js/characters/assassin.js"></script>
    <script src="js/characters/grinder.js"></script>
    <script src="js/characters/dio.js"></script>
    <script src="js/characters/sans.js"></script>
    <script src="js/characters/archer.js"></script>
    <script src="js/characters/vampire.js"></script>
    <script src="js/characters/index.js"></script>
    <script src="js/input.js"></script>
    <script src="js/bgm.js"></script>
    <script src="js/game.js"></script>
    <script src="js/net.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
