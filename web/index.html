<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1v1 Arena (웹 버전)</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stage">
        <canvas id="game" width="1280" height="720"></canvas>

        <!-- 시작 화면의 온라인 메뉴 -->
        <div id="lobby" hidden>
            <div class="menu">
                <div class="title">온라인 대전 <small>(다른 기기와 함께)</small></div>
                <div class="row">
                    <button id="btn-create" type="button">방 만들기</button>
                    <span class="or">또는</span>
                    <input id="room-code" type="text" placeholder="방 코드" maxlength="4" autocomplete="off" spellcheck="false">
                    <button id="btn-join" type="button">방 들어가기</button>
                </div>
                <div class="keys">온라인 조작: 이동 방향키 · 평타 Q · 스킬 W, E · 궁극기 R · 준비 SPACE</div>
                <div class="server"></div>
            </div>
            <div class="busy" hidden>
                <div class="busy-text"></div>
                <button id="btn-cancel" type="button">취소</button>
            </div>
            <div class="notice"></div>
        </div>

        <!-- 온라인 대전 중 상태 표시줄 -->
        <div id="online-bar" hidden>
            <span class="bar-text"></span>
            <button id="btn-leave" type="button">나가기</button>
        </div>
    </div>

    <!-- 순서가 중요하다: 아래 파일이 위 파일의 기능을 가져다 쓴다 -->
    <script src="js/core.js"></script>
    <script src="js/status.js"></script>
    <script src="js/world.js"></script>
    <script src="js/player.js"></script>
    <script src="js/characters/common.js"></script>
    <script src="js/terrain.js"></script>
    <script src="js/characters/swordman.js"></script>
    <script src="js/characters/mage.js"></script>
    <script src="js/characters/fighter.js"></script>
    <script src="js/characters/accelerator.js"></script>
    <script src="js/characters/demolitionist.js"></script>
    <script src="js/characters/hacker.js"></script>
    <script src="js/characters/assassin.js"></script>
    <script src="js/characters/grinder.js"></script>
    <script src="js/characters/dio.js"></script>
    <script src="js/characters/sans.js"></script>
    <script src="js/characters/archer.js"></script>
    <script src="js/characters/index.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
    <script src="js/net.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
